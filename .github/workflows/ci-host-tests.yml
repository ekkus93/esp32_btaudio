name: CI — host tests (optimized)

on:
  push:
    paths:
      - 'esp_bt_audio_source/**'
      - '.github/workflows/ci-host-tests.yml'
  pull_request:
    paths:
      - 'esp_bt_audio_source/**'
  workflow_dispatch:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-host-deps-${{ hashFiles('**/CMakeLists.txt','esp_bt_audio_source/test/host_test/**') }}
          restore-keys: |
            ${{ runner.os }}-host-deps-

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config git

      - name: Clean configure and build complete host graph
        working-directory: esp_bt_audio_source/test/host_test
        run: |
          set -euo pipefail
          rm -rf build_host_tests
          cmake -S . -B build_host_tests
          cmake --build build_host_tests --parallel "$(nproc)"
          cmake --build build_host_tests --target help \
            | LC_ALL=C sort \
            > build_host_tests/cmake-targets.txt
          ctest --test-dir build_host_tests --show-only=json-v1 \
            > build_host_tests/ctest-inventory.json

      - name: Run full-duplex state sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_duplex_state_test.sh

      - name: Run HFP Audio Gateway sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_ag_test.sh

      - name: Run HFP SLC operation sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_connection_test.sh

      - name: Run manager HFP profile rollback sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_manager_hfp_profiles_test.sh

      - name: Run HFP PCM ring sanitizer tests
        run: bash esp_bt_audio_source/tools/run_hfp_pcm_ring_test.sh

      - name: Run HFP voice conversion sanitizer tests
        run: bash esp_bt_audio_source/tools/run_hfp_voice_convert_test.sh

      - name: Run HFP I2S output sanitizer tests
        run: bash esp_bt_audio_source/tools/run_hfp_i2s_output_test.sh

      - name: Run HFP incoming audio sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_audio_test.sh

      - name: Run HFP audio control sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_audio_control_test.sh

      - name: Run HFP FD-13 diagnostics sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_diagnostics_test.sh

      - name: Run FD-16 duplex policy sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_duplex_policy_test.sh

      - name: Run HFP command sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_hfp_commands_test.sh

      - name: Run A2DP binding lifecycle sanitizer tests
        run: bash esp_bt_audio_source/tools/run_bt_a2dp_binding_lifecycle_test.sh

      - name: Install Python test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pyserial

      - name: Run Python lint gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -m pip install flake8
          log_dir="esp_bt_audio_source/test/host_test/build_host_tests"
          mkdir -p "${log_dir}"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="${GITHUB_SHA}^"
          fi
          git fetch --no-tags --depth=1 origin "${base_sha}"

          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMR "${base_sha}" "${GITHUB_SHA}" -- '*.py' \
              | grep -E '^(tools|esp_bt_audio_source/tools)/' || true
          )

          if (( ${#changed_python[@]} > 0 )); then
            printf 'Strict flake8 gate for changed Python files:\n%s\n' "${changed_python[*]}"
            python3 -m flake8 "${changed_python[@]}" 2>&1 \
              | tee "${log_dir}/flake8-changed.log"
          else
            echo "No changed Python files in maintained tool paths" \
              | tee "${log_dir}/flake8-changed.log"
          fi

          set +e
          python3 -m flake8 tools esp_bt_audio_source/tools \
            > "${log_dir}/flake8-full-tree.log" 2>&1
          full_tree_status=$?
          set -e
          if (( full_tree_status != 0 )); then
            count=$(wc -l < "${log_dir}/flake8-full-tree.log")
            echo "::warning::Legacy full-tree flake8 backlog remains (${count} findings); changed Python files are the enforced gate. See flake8-full-tree.log."
          fi

      - name: Run Python unit tests
        run: |
          set -euo pipefail
          python3 -m pytest -q esp_bt_audio_source/tools/tests

      - name: Run complete CTest suite
        working-directory: esp_bt_audio_source/test/host_test/build_host_tests
        run: |
          set -euo pipefail
          if ctest --help | grep -q -- --output-junit; then
            ctest --output-on-failure -j1 --output-junit test-results.xml 2>&1 | tee ctest.log
          else
            ctest --output-on-failure -j1 2>&1 | tee ctest.log
          fi

      - name: Prepare artifacts
        if: always()
        working-directory: esp_bt_audio_source/test/host_test/build_host_tests
        run: |
          if [ -f test-results.xml ]; then
            echo "JUnit XML produced"
          elif [ ! -f ctest.log ]; then
            echo "CTest did not run; see the build and sanitizer steps" > ctest.log
          fi

      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results
          path: |
            esp_bt_audio_source/test/host_test/build_host_tests/*.xml
            esp_bt_audio_source/test/host_test/build_host_tests/*.log
            esp_bt_audio_source/test/host_test/build_host_tests/**/*.log
            esp_bt_audio_source/test/host_test/build_host_tests/cmake-targets.txt
            esp_bt_audio_source/test/host_test/build_host_tests/ctest-inventory.json
            esp_bt_audio_source/test/host_test/build_host_tests/*_compile.log
            esp_bt_audio_source/test/host_test/build_host_tests/*_test.log

      - name: Inspect JUnit artifact
        if: always()
        working-directory: esp_bt_audio_source/test/host_test/build_host_tests
        run: |
          echo "PWD: $(pwd)"
          if [ -f test-results.xml ]; then
            echo "Found test-results.xml (head):"
            head -n 80 test-results.xml
          else
            echo "No test-results.xml found"
          fi

      - name: Annotate JUnit XML as GitHub annotations
        if: always()
        working-directory: esp_bt_audio_source/test/host_test/build_host_tests
        run: |
          echo "Searching for JUnit XML files to annotate..."
          shopt -s nullglob
          xmls=( *.xml )
          if [ ${#xmls[@]} -eq 0 ]; then
            echo "No JUnit XML files found"
            exit 0
          fi
          python3 - <<'PY'
          import glob
          import re
          import xml.etree.ElementTree as ET

          for filename in glob.glob('*.xml'):
              try:
                  tree = ET.parse(filename)
              except Exception as exc:
                  print(f"::warning file={filename}::Could not parse XML: {exc}")
                  continue
              root = tree.getroot()
              for testcase in root.findall('.//testcase'):
                  name = testcase.attrib.get('name', '(unnamed)')
                  classname = testcase.attrib.get('classname', '')
                  file_attr = testcase.attrib.get('file') or testcase.attrib.get('classname') or ''
                  line_attr = testcase.attrib.get('line') or ''
                  node = testcase.find('failure')
                  if node is None:
                      node = testcase.find('error')
                  if node is None:
                      continue
                  title = f"{classname}.{name}" if classname else name
                  message = (node.text or '') + ' ' + (node.attrib.get('message', '') or '')
                  message = message.strip()
                  if not file_attr:
                      match = re.search(r'File "([^"]+)", line (\d+)', message)
                      if match:
                          file_attr = match.group(1)
                          line_attr = match.group(2)
                  if len(message) > 1200:
                      message = message[:1200] + '...'
                  escape = lambda value: value.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  title_e = escape(title)
                  message_e = escape(message)
                  if file_attr and line_attr:
                      print(f"::error file={escape(file_attr)},line={line_attr},title={title_e}::{message_e}")
                  elif file_attr:
                      print(f"::error file={escape(file_attr)},title={title_e}::{message_e}")
                  else:
                      print(f"::error title={title_e}::{message_e}")
          PY

      - name: Compress build directory for failure artifacts
        if: failure()
        working-directory: esp_bt_audio_source/test/host_test
        run: |
          if [ -d build_host_tests ]; then
            tar -czf build_host_tests.tar.gz build_host_tests
          else
            echo "No build_host_tests directory to archive"
          fi

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_host_tests
          path: esp_bt_audio_source/test/host_test/build_host_tests.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-logs
          path: esp_bt_audio_source/test/host_test/build_host_tests/**/*.log

      - name: Publish host workflow commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          job_status = os.environ['JOB_STATUS']
          state = {
              'success': 'success',
              'failure': 'failure',
              'cancelled': 'error',
          }.get(job_status, 'error')
          payload = json.dumps({
              'state': state,
              'context': 'ci/host-tests-optimized',
              'description': f'Host workflow {job_status}; run {os.environ["GITHUB_RUN_ID"]}',
              'target_url': os.environ['RUN_URL'],
          }).encode('utf-8')
          request = urllib.request.Request(
              f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}/statuses/{os.environ["GITHUB_SHA"]}',
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'unexpected status API response: {response.status}')
          PY
