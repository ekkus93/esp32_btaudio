name: Duplex source snapshot

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'feature/esp-bt-audio-duplex'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Package source tree
        run: |
          tar \
            --exclude='.git' \
            --exclude='**/build' \
            --exclude='**/build_*' \
            --exclude='**/.venv' \
            --exclude='**/node_modules' \
            -czf /tmp/esp32-btaudio-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: esp32-btaudio-source
          path: /tmp/esp32-btaudio-source.tar.gz
          retention-days: 1
