name: Apply duplex Ralph patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/duplex-ralph-payload

permissions:
  contents: write

concurrency:
  group: duplex-ralph-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/esp-bt-audio-duplex'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Apply and commit payload
        run: |
          set -euo pipefail
          payload=.github/duplex-ralph-payload
          message="$(head -n 1 "$payload")"
          tail -n +2 "$payload" > /tmp/duplex-ralph.patch
          test -n "$message"
          test -s /tmp/duplex-ralph.patch
          git config user.name "ChatGPT Ralph Loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check /tmp/duplex-ralph.patch
          git apply --index /tmp/duplex-ralph.patch
          : > "$payload"
          git add "$payload"
          git commit -m "$message"
          git push origin HEAD:feature/esp-bt-audio-duplex
