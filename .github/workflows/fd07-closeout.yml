name: FD-07 one-shot closeout

on:
  push:
    branches:
      - feature/esp-bt-audio-duplex
    paths:
      - .github/workflows/fd07-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Record FD-07 completion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code_head = "172f8c5ccc3db1c48d5affd6ab116d065a2ed310"
          host_run = 721
          device_run = 615

          # memory.md: newest entries live immediately after the banner.
          memory_path = Path("memory.md")
          memory = memory_path.read_text()
          memory_heading = (
              "## 2026-07-28T05:20:46Z - GPT-5.6 Thinking - "
              "completed FD-03 through FD-07 full-duplex software foundations"
          )
          if memory_heading not in memory:
              entry = f'''{memory_heading}

          - Continued exclusively on `feature/esp-bt-audio-duplex`; no helper branch or additional PR was created, and no hardware was flashed.
          - FD-03 added the authoritative generation-checked duplex snapshot and legal transition matrices. FD-04 added a caller-owned bounded SPSC HFP PCM ring with whole-frame writes and protected 64-bit statistics. FD-05 added no-fabrication CVSD/downmix/rate-conversion helpers.
          - FD-06 added the asynchronous ESP-IDF v5.5.1 HFP Audio Gateway lifecycle, normalized HFP events, stage-accurate reverse rollback, and callback-shutdown quarantine rules.
          - FD-07 added public `bt_hfp_connect()` / `bt_hfp_disconnect()` APIs, same-active-peer enforcement, BtAppTask-owned lower-layer requests, separation of request acceptance from callback-confirmed SLC completion, generation-bound stale-event rejection/counters, bounded request/SLC watchdogs, remote-rejection visibility, and no SCO startup.
          - Final acceptance review found and fixed two omissions after an earlier green run: the HFP APIs are now exported through `bt_manager.h`, and FD-07 timer/semaphore/mutex cleanup is chained to the verified post-Bluedroid HFP cleanup boundary. Standalone host suites use explicit test-only cleanup stubs; production behavior is not weakened.
          - Validated code head `{code_head}`: strict host CI run {host_run} passed all focused ASan/UBSan suites, manager rollback coverage, changed-Python lint, Python tests, and full CTest; ESP-IDF v5.5.1 device-build run {device_run} passed.
          - Hardware-gated work remains: FD-01 runtime heap/stack/A2DP baseline measurements and real WROOM32 HFP/SLC event confirmation. FD-08 is the next software phase.
          '''
              banner_end = memory.find("\n\n")
              if banner_end < 0:
                  raise RuntimeError("memory.md banner separator not found")
              memory = memory[: banner_end + 2] + entry + "\n" + memory[banner_end + 2 :]
              memory_path.write_text(memory)

          # TODO: close only FD-07 and retain all later work as pending.
          todo_path = Path(
              "esp_bt_audio_source/docs/ESP_BT_AUDIO_FULL_DUPLEX_TODO_2026-07-27.md"
          )
          todo = todo_path.read_text()
          start = todo.index("## FD-07 — Add HFP connect/disconnect public APIs [P0]")
          end = todo.index("# Phase 4 — I2S0 microphone output and CVSD data flow", start)
          block = todo[start:end]

          if "components/bt_manager/bt_hfp_connection.c" not in block:
              files = '''### Files

          ```text
          components/bt_manager/bt_hfp_connection.c
          components/bt_manager/include/bt_hfp_connection.h
          components/bt_manager/include/bt_manager.h
          components/bt_manager/bt_hfp_ag_events.c
          components/bt_manager/bt_hfp_ag_lifecycle.c
          components/bt_manager/bt_duplex_state_events.c
          components/bt_manager/CMakeLists.txt
          ```

          '''
              block = block.replace("### Public API\n", files + "### Public API\n", 1)

          block = block.replace(
              "Add typed functions similar to:", "Implemented public API:"
          )
          block = block.replace("- [ ] ", "- [x] ")

          if "Bind each accepted connect/disconnect operation" not in block:
              block = block.replace(
                  "- [x] Separate accepted operation from confirmed completion.\n",
                  "- [x] Separate accepted operation from confirmed completion.\n"
                  "- [x] Bind each accepted connect/disconnect operation to the active session generation.\n"
                  "- [x] Reject and count completion/events associated with a stale operation generation.\n",
                  1,
              )
          if "Late same-peer completion/event" not in block:
              block = block.replace(
                  "- [x] Remote rejection is delivered asynchronously as failure event.\n",
                  "- [x] Remote rejection is delivered asynchronously as failure event.\n"
                  "- [x] Late same-peer completion/event for an old generation is ignored and counted.\n",
                  1,
              )

          if f"Strict host CI run {host_run}" not in block:
              separator = "\n---\n\n"
              if block.endswith(separator):
                  block = block[: -len(separator)]
              block = block.rstrip() + f'''\n\n### Validation

          - [x] Focused HFP SLC operation suite passes under AddressSanitizer and UndefinedBehaviorSanitizer.
          - [x] Public HFP connect/disconnect declarations are exported through `bt_manager.h`.
          - [x] FD-07 timer, semaphore, and mutex cleanup is chained to the verified post-Bluedroid HFP cleanup boundary.
          - [x] Strict host CI run {host_run} passes all focused sanitizer suites, changed-Python lint, Python unit tests, and full CTest.
          - [x] ESP-IDF v5.5.1 device-build run {device_run} passes.
          - [x] HFP audio/SCO is never started by FD-07.
          - [x] No hardware was flashed. Real WROOM32 SLC event confirmation remains hardware-gated.

          ---

          '''

          todo = todo[:start] + block + todo[end:]
          todo_path.write_text(todo)

          # Maintained implementation progress.
          progress_path = Path(
              "esp_bt_audio_source/docs/ESP_BT_AUDIO_FULL_DUPLEX_PROGRESS_2026-07-27.md"
          )
          progress = progress_path.read_text()
          progress = progress.replace(
              "**Latest validated code head:** `70d55d57c5df7fc9ba96a174d96260f660191378`",
              f"**Latest validated code head:** `{code_head}`",
              1,
          )
          if "## FD-07 — Generation-bound HFP SLC connect/disconnect APIs" not in progress:
              progress = progress.rstrip() + f'''\n\n## FD-07 — Generation-bound HFP SLC connect/disconnect APIs

          Implemented on `feature/esp-bt-audio-duplex`:

          - Public `bt_hfp_connect()` and `bt_hfp_disconnect()` declarations are exported through `bt_manager.h`; `bt_duplex_get_snapshot()` remains the authoritative completion/status view.
          - MAC addresses are parsed with the existing strict helper, and HFP operations require the same active peer already owned by the A2DP/ACL manager state.
          - A different remote peer is rejected and counted; no second headset/session is silently accepted.
          - Lower-layer `esp_hf_ag_slc_connect()` and `esp_hf_ag_slc_disconnect()` calls run through the existing BtAppTask work-dispatch ownership model.
          - The synchronous API result means the queued request reached the lower layer and was accepted or rejected immediately. SLC completion remains asynchronous and is confirmed only by HFP connection-state callbacks.
          - Every accepted operation records the active session generation, peer, serial number, operation type, deadline, immediate result, completion state, and explicit failure counters.
          - Late same-peer events after timeout or generation change are ignored and counted instead of mutating the current session.
          - A bounded BtAppTask request wait and a bounded SLC watchdog replace unbounded waits. Timeout leaves the profile state unchanged and degraded/visible; it never fabricates disconnection.
          - Remote connect rejection is reported asynchronously as a rejected operation with an explicit counter/error.
          - Already-connected connect and already-disconnected disconnect are deterministic and idempotent.
          - FD-07 never starts SCO audio or registers SCO data callbacks.
          - FD-07 timer, semaphore, and mutex cleanup is chained to `bt_hfp_ag_force_cleanup_after_stack_shutdown()`, after Bluedroid is confirmed unable to deliver callbacks.
          - Standalone AG/manager host suites use explicit test-only cleanup stubs; production behavior is not replaced by a permissive fallback.

          Validation for code head `{code_head}`:

          - Focused HFP SLC operation sanitizer suite: PASS.
          - HFP AG lifecycle/event and manager profile rollback sanitizer suites: PASS.
          - Full-duplex state, HFP PCM ring, and HFP voice conversion sanitizer suites: PASS.
          - Strict host CI run {host_run}: PASS, including changed-Python lint, Python unit tests, and full CTest.
          - ESP-IDF v5.5.1 device-build run {device_run}: PASS.
          - No hardware was flashed.

          Real WROOM32 SLC event delivery and earbud behavior remain hardware-gated and are not claimed complete.

          ## Next phase

          FD-08 adds the I2S0 TX microphone-output component. It must preserve the selected GPIO32/GPIO33/GPIO27 master-output contract, reject pin conflicts visibly, and provide bounded writer-task shutdown and quarantine behavior.
          '''
              progress_path.write_text(progress)
          PY

      - name: Commit closeout and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fd07-closeout.yml
          git add \
            memory.md \
            esp_bt_audio_source/docs/ESP_BT_AUDIO_FULL_DUPLEX_TODO_2026-07-27.md \
            esp_bt_audio_source/docs/ESP_BT_AUDIO_FULL_DUPLEX_PROGRESS_2026-07-27.md
          git diff --cached --check
          git commit -m "docs(duplex): complete FD-07"
          git push origin HEAD:feature/esp-bt-audio-duplex
