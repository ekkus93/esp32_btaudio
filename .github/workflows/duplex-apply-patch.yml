name: Apply duplex phase patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/duplex-apply.patch

permissions:
  contents: write

concurrency:
  group: duplex-apply-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/esp-bt-audio-duplex'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Apply and commit project patch
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Ralph Loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check .github/duplex-apply.patch
          git apply --index .github/duplex-apply.patch
          git commit -m "chore(duplex): establish baseline and HFP configuration"
          git push origin HEAD:feature/esp-bt-audio-duplex
