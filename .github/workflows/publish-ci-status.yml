name: Publish CI Status

on:
  workflow_run:
    workflows:
      - CI — host tests (optimized)
      - CI — device build (compile only)
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-esp-bt-audio-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest host and device CI status
    if: >-
      ${{
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Update authoritative branch CI status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          TRIGGER_RUN_STATUS: ${{ github.event.workflow_run.status }}
          TRIGGER_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          TRIGGER_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          case "${HEAD_BRANCH}" in
            master)
              issue_number="3"
              issue_title="CI Status: Host + Device — master"
              ;;
            feature/esp-bt-audio-duplex)
              issue_number="4"
              issue_title="CI Status: Host + Device — feature/esp-bt-audio-duplex"
              ;;
            *)
              printf 'Ignoring unmonitored branch %q.\n' "${HEAD_BRANCH}"
              exit 0
              ;;
          esac

          case "${TRIGGER_WORKFLOW_NAME}" in
            "CI — host tests (optimized)")
              trigger_key="host"
              ;;
            "CI — device build (compile only)")
              trigger_key="device"
              ;;
            *)
              printf 'Unsupported triggering workflow: %s\n' \
                "${TRIGGER_WORKFLOW_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ -z "${HEAD_SHA}" ]]; then
            printf 'Missing triggering workflow SHA for branch %q.\n' \
              "${HEAD_BRANCH}" >&2
            exit 1
          fi

          host_run_file="${RUNNER_TEMP}/host-run.json"
          device_run_file="${RUNNER_TEMP}/device-run.json"
          host_jobs_file="${RUNNER_TEMP}/host-jobs.json"
          device_jobs_file="${RUNNER_TEMP}/device-jobs.json"
          host_artifacts_file="${RUNNER_TEMP}/host-artifacts.json"
          device_artifacts_file="${RUNNER_TEMP}/device-artifacts.json"
          body_file="${RUNNER_TEMP}/ci-status.md"
          patch_file="${RUNNER_TEMP}/ci-status-patch.json"

          fetch_latest_applicable_run() {
            local workflow_file="$1"
            local output_file="$2"
            local raw_file="${output_file}.raw"

            gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              -f branch="${HEAD_BRANCH}" \
              -f per_page=20 \
              > "${raw_file}"

            python3 - "${raw_file}" "${output_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          payload = json.loads(source.read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("workflow run response does not contain a workflow_runs array")

          allowed_events = {"push", "workflow_dispatch"}
          selected = next(
              (run for run in runs if run.get("event") in allowed_events),
              None,
          )
          destination.write_text(
              json.dumps({"workflow_runs": [selected] if selected else []}),
              encoding="utf-8",
          )
          PY
          }

          fetch_latest_applicable_run \
            "ci-host-tests.yml" \
            "${host_run_file}"
          fetch_latest_applicable_run \
            "ci-device-build.yml" \
            "${device_run_file}"

          trigger_run_file="${host_run_file}"
          if [[ "${trigger_key}" == "device" ]]; then
            trigger_run_file="${device_run_file}"
          fi

          latest_trigger_id="$(
            python3 - "${trigger_run_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs", [])
          print(runs[0].get("id", "") if runs else "")
          PY
          )"

          if [[ -z "${latest_trigger_id}" ]]; then
            printf 'Could not resolve the latest applicable %s run for branch %s.\n' \
              "${trigger_key}" "${HEAD_BRANCH}" >&2
            exit 1
          fi

          if [[ "${latest_trigger_id}" != "${TRIGGER_RUN_ID}" ]]; then
            printf 'Skipping stale %s state for run %s; latest applicable run is %s.\n' \
              "${trigger_key}" "${TRIGGER_RUN_ID}" "${latest_trigger_id}"
            exit 0
          fi

          fetch_run_details() {
            local run_file="$1"
            local jobs_file="$2"
            local artifacts_file="$3"
            local run_id

            run_id="$(
              python3 - "${run_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs", [])
          print(runs[0].get("id", "") if runs else "")
          PY
            )"

            if [[ -z "${run_id}" ]]; then
              printf '%s\n' '{"total_count":0,"jobs":[]}' > "${jobs_file}"
              printf '%s\n' '{"total_count":0,"artifacts":[]}' > "${artifacts_file}"
              return
            fi

            gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs/${run_id}/jobs" \
              -f filter=latest \
              -f per_page=100 \
              > "${jobs_file}"

            gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts" \
              -f per_page=100 \
              > "${artifacts_file}"

            python3 - "${jobs_file}" "${artifacts_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          jobs_path = Path(sys.argv[1])
          artifacts_path = Path(sys.argv[2])

          jobs_payload = json.loads(jobs_path.read_text(encoding="utf-8"))
          jobs = jobs_payload.get("jobs")
          if not isinstance(jobs, list):
              raise SystemExit("jobs response does not contain a jobs array")
          job_total = jobs_payload.get("total_count", len(jobs))
          if not isinstance(job_total, int):
              raise SystemExit("jobs response total_count is not an integer")
          if job_total > len(jobs):
              raise SystemExit(
                  f"workflow contains {job_total} jobs but only {len(jobs)} "
                  "were retrieved; pagination support must be extended"
              )

          artifacts_payload = json.loads(
              artifacts_path.read_text(encoding="utf-8")
          )
          artifacts = artifacts_payload.get("artifacts")
          if not isinstance(artifacts, list):
              raise SystemExit(
                  "artifacts response does not contain an artifacts array"
              )
          artifact_total = artifacts_payload.get("total_count", len(artifacts))
          if not isinstance(artifact_total, int):
              raise SystemExit(
                  "artifacts response total_count is not an integer"
              )
          if artifact_total > len(artifacts):
              raise SystemExit(
                  f"workflow contains {artifact_total} artifacts but only "
                  f"{len(artifacts)} were retrieved; pagination support must "
                  "be extended"
              )
          PY
          }

          fetch_run_details \
            "${host_run_file}" \
            "${host_jobs_file}" \
            "${host_artifacts_file}"
          fetch_run_details \
            "${device_run_file}" \
            "${device_jobs_file}" \
            "${device_artifacts_file}"

          python3 - \
            "${host_run_file}" \
            "${host_jobs_file}" \
            "${host_artifacts_file}" \
            "${device_run_file}" \
            "${device_jobs_file}" \
            "${device_artifacts_file}" \
            "${body_file}" \
            "${issue_number}" \
            "${issue_title}" <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          (
              host_run_path,
              host_jobs_path,
              host_artifacts_path,
              device_run_path,
              device_jobs_path,
              device_artifacts_path,
              body_path,
          ) = map(Path, sys.argv[1:8])
          issue_number = int(sys.argv[8])
          issue_title = sys.argv[9]

          abnormal_conclusions = {
              "action_required",
              "cancelled",
              "failure",
              "stale",
              "startup_failure",
              "timed_out",
          }

          def load_json(path: Path) -> dict[str, Any]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"{path} does not contain a JSON object")
              return payload

          def clean_text(value: Any) -> str:
              text = "" if value is None else str(value)
              text = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", "�", text)
              return text.replace("`", "'").replace("\r", " ").replace("\n", " ")

          def normalize_artifacts(payload: dict[str, Any]) -> list[dict[str, Any]]:
              artifacts = payload.get("artifacts", [])
              if not isinstance(artifacts, list):
                  raise SystemExit("artifacts payload is malformed")
              normalized = []
              for artifact in artifacts:
                  normalized.append(
                      {
                          "id": artifact.get("id"),
                          "name": artifact.get("name"),
                          "size_in_bytes": artifact.get("size_in_bytes"),
                          "expired": artifact.get("expired"),
                          "created_at": artifact.get("created_at"),
                          "expires_at": artifact.get("expires_at"),
                          "updated_at": artifact.get("updated_at"),
                      }
                  )
              return normalized

          def normalize_workflow(
              key: str,
              run_payload: dict[str, Any],
              jobs_payload: dict[str, Any],
              artifacts_payload: dict[str, Any],
          ) -> dict[str, Any]:
              raw_runs = run_payload.get("workflow_runs", [])
              if not isinstance(raw_runs, list):
                  raise SystemExit("workflow_runs payload is malformed")
              if not raw_runs:
                  return {
                      "key": key,
                      "present": False,
                      "status": "missing",
                      "conclusion": None,
                      "jobs_available": False,
                      "problem_steps": [],
                      "jobs": [],
                      "artifacts": [],
                  }

              raw_run = raw_runs[0]
              raw_jobs = jobs_payload.get("jobs", [])
              if not isinstance(raw_jobs, list):
                  raise SystemExit("jobs payload is malformed")

              jobs = []
              problem_steps = []
              for raw_job in raw_jobs:
                  steps = []
                  for raw_step in raw_job.get("steps", []):
                      step = {
                          "number": raw_step.get("number"),
                          "name": raw_step.get("name"),
                          "status": raw_step.get("status"),
                          "conclusion": raw_step.get("conclusion"),
                          "started_at": raw_step.get("started_at"),
                          "completed_at": raw_step.get("completed_at"),
                      }
                      steps.append(step)
                      if step["conclusion"] in abnormal_conclusions:
                          problem_steps.append(
                              {
                                  "job_id": raw_job.get("id"),
                                  "job": raw_job.get("name"),
                                  "step_number": step["number"],
                                  "step": step["name"],
                                  "conclusion": step["conclusion"],
                              }
                          )

                  if raw_job.get("conclusion") in abnormal_conclusions and not any(
                      item["job_id"] == raw_job.get("id")
                      for item in problem_steps
                  ):
                      problem_steps.append(
                          {
                              "job_id": raw_job.get("id"),
                              "job": raw_job.get("name"),
                              "step_number": None,
                              "step": None,
                              "conclusion": raw_job.get("conclusion"),
                          }
                      )

                  jobs.append(
                      {
                          "id": raw_job.get("id"),
                          "url": raw_job.get("html_url"),
                          "name": raw_job.get("name"),
                          "status": raw_job.get("status"),
                          "conclusion": raw_job.get("conclusion"),
                          "runner_name": raw_job.get("runner_name"),
                          "runner_group_name": raw_job.get("runner_group_name"),
                          "started_at": raw_job.get("started_at"),
                          "completed_at": raw_job.get("completed_at"),
                          "steps": steps,
                      }
                  )

              return {
                  "key": key,
                  "present": True,
                  "workflow": raw_run.get("name"),
                  "workflow_id": raw_run.get("workflow_id"),
                  "run_id": raw_run.get("id"),
                  "run_number": raw_run.get("run_number"),
                  "run_attempt": raw_run.get("run_attempt"),
                  "run_url": raw_run.get("html_url"),
                  "status": raw_run.get("status"),
                  "conclusion": raw_run.get("conclusion"),
                  "event": raw_run.get("event"),
                  "head_branch": raw_run.get("head_branch"),
                  "head_sha": raw_run.get("head_sha"),
                  "created_at": raw_run.get("created_at"),
                  "updated_at": raw_run.get("updated_at"),
                  "jobs_available": bool(jobs),
                  "problem_steps": problem_steps,
                  "jobs": jobs,
                  "artifacts": normalize_artifacts(artifacts_payload),
              }

          host = normalize_workflow(
              "host",
              load_json(host_run_path),
              load_json(host_jobs_path),
              load_json(host_artifacts_path),
          )
          device = normalize_workflow(
              "device",
              load_json(device_run_path),
              load_json(device_jobs_path),
              load_json(device_artifacts_path),
          )

          same_sha = bool(
              host.get("head_sha")
              and device.get("head_sha")
              and host["head_sha"] == device["head_sha"]
          )

          conclusions = {host.get("conclusion"), device.get("conclusion")}
          statuses = {host.get("status"), device.get("status")}
          if conclusions & abnormal_conclusions:
              overall = "failure"
          elif not host["present"] or not device["present"]:
              overall = "pending"
          elif not same_sha:
              overall = "sha_mismatch"
          elif statuses == {"completed"} and conclusions == {"success"}:
              overall = "success"
          else:
              overall = "pending"

          published_at = (
              datetime.now(timezone.utc)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload = {
              "schema_version": 2,
              "publisher": {
                  "workflow_file": ".github/workflows/publish-ci-status.yml",
                  "issue_number": issue_number,
                  "monitored_branch": os.environ["HEAD_BRANCH"],
              },
              "trigger": {
                  "workflow": os.environ["TRIGGER_WORKFLOW_NAME"],
                  "run_id": int(os.environ["TRIGGER_RUN_ID"]),
                  "run_attempt": int(os.environ["TRIGGER_RUN_ATTEMPT"]),
                  "run_url": os.environ["TRIGGER_RUN_URL"],
                  "status": os.environ["TRIGGER_RUN_STATUS"],
                  "conclusion": os.environ["TRIGGER_RUN_CONCLUSION"] or None,
                  "event": os.environ["TRIGGER_EVENT"],
                  "head_branch": os.environ["HEAD_BRANCH"],
                  "head_sha": os.environ["HEAD_SHA"],
                  "created_at": os.environ["TRIGGER_CREATED_AT"],
                  "updated_at": os.environ["TRIGGER_UPDATED_AT"],
              },
              "overall": overall,
              "same_sha": same_sha,
              "published_at": published_at,
              "details_compacted": False,
              "host": host,
              "device": device,
          }

          def workflow_counts(workflow: dict[str, Any]) -> str:
              jobs = workflow.get("jobs", [])
              completed = sum(job.get("status") == "completed" for job in jobs)
              failed = sum(
                  job.get("conclusion") in abnormal_conclusions for job in jobs
              )
              running = sum(job.get("status") == "in_progress" for job in jobs)
              queued = sum(job.get("status") == "queued" for job in jobs)
              return (
                  f"{len(jobs)} jobs: {completed} completed, {failed} abnormal, "
                  f"{running} running, {queued} queued"
              )

          def run_line(label: str, workflow: dict[str, Any]) -> str:
              if not workflow["present"]:
                  return f"- **{label}:** no applicable run found"
              conclusion = workflow.get("conclusion") or "pending"
              return (
                  f'- **{label}:** `{clean_text(workflow.get("status"))}` / '
                  f'`{clean_text(conclusion)}` — '
                  f'[run {workflow.get("run_id")}]'
                  f'({workflow.get("run_url")}) — '
                  f'`{clean_text(workflow.get("head_sha"))}` — '
                  f'{workflow_counts(workflow)} — '
                  f'{len(workflow.get("artifacts", []))} artifacts'
              )

          def render(current_payload: dict[str, Any]) -> str:
              problems = (
                  current_payload["host"]["problem_steps"]
                  + current_payload["device"]["problem_steps"]
              )
              if problems:
                  problem_lines = [
                      "- **Problem steps:**",
                      *[
                          (
                              f'  - `{clean_text(item.get("job"))}` / '
                              f'`{clean_text(item.get("step") or "(job-level)")}` '
                              f'— `{clean_text(item.get("conclusion"))}` '
                              f'— job `{item.get("job_id")}`'
                          )
                          for item in problems
                      ],
                  ]
              else:
                  problem_lines = ["- **Problem steps:** None"]

              lines = [
                  "<!-- maintained by publish-ci-status.yml -->",
                  "# Latest ESP32 Bluetooth Audio CI Status",
                  "",
                  f'- **Branch:** `{clean_text(current_payload["publisher"]["monitored_branch"])}`',
                  f'- **Overall:** `{clean_text(current_payload["overall"])}`',
                  f'- **Host/device same SHA:** `{str(current_payload["same_sha"]).lower()}`',
                  run_line("Host tests", current_payload["host"]),
                  run_line("Device compile-only", current_payload["device"]),
                  *problem_lines,
                  f'- **Published:** `{clean_text(current_payload["published_at"])}`',
                  "",
                  "## Machine-readable status",
                  "",
                  "```json",
                  json.dumps(current_payload, indent=2, sort_keys=True),
                  "```",
                  "",
                  "This issue is overwritten whenever the latest applicable host or device run changes state. It is not a historical log.",
              ]
              return "\n".join(lines) + "\n"

          body = render(payload)
          if len(body.encode("utf-8")) > 60000:
              payload["details_compacted"] = True
              payload["compaction_reason"] = "issue_body_size_limit"
              for workflow in (payload["host"], payload["device"]):
                  problem_job_ids = {
                      item["job_id"] for item in workflow["problem_steps"]
                  }
                  for job in workflow["jobs"]:
                      job["step_count"] = len(job.get("steps", []))
                      if job.get("id") not in problem_job_ids:
                          job["steps"] = []
                          job["steps_compacted"] = True
              body = render(payload)

          if len(body.encode("utf-8")) > 60000:
              raise SystemExit(
                  "status issue body exceeds 60000 bytes after safe compaction"
              )

          body_path.write_text(body, encoding="utf-8")
          PY

          current_body="$(
            gh api \
              "repos/${REPOSITORY}/issues/${issue_number}" \
              --jq '.body'
          )"
          if [[ "${current_body}" != *"<!-- maintained by publish-ci-status.yml -->"* ]]; then
            printf 'Issue #%s does not contain the expected publisher marker.\n' \
              "${issue_number}" >&2
            exit 1
          fi

          python3 - \
            "${body_file}" \
            "${patch_file}" \
            "${issue_title}" <<'PY'
          import json
          import sys
          from pathlib import Path

          body = Path(sys.argv[1]).read_text(encoding="utf-8")
          patch = {
              "title": sys.argv[3],
              "body": body,
              "state": "open",
          }
          Path(sys.argv[2]).write_text(
              json.dumps(patch),
              encoding="utf-8",
          )
          PY

          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${issue_number}" \
            --input "${patch_file}" \
            >/dev/null

          printf 'Published combined host/device CI status for branch %s to issue #%s.\n' \
            "${HEAD_BRANCH}" "${issue_number}"
