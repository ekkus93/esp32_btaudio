name: One-shot Duplex Review Documentation Closeout

on:
  push:
    branches:
      - feature/esp-bt-audio-duplex
    paths:
      - .github/workflows/one-shot-duplex-review-docs-closeout.yml

permissions:
  contents: write

concurrency:
  group: one-shot-duplex-review-docs-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Correct review closeout text
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Correct reconciliation typo
        shell: bash
        run: |
          set -euo pipefail
          todo='esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_REVIEW_FIXES_TODO_2026-07-30.md'
          count=$(grep -Fc 'FIX-02 stale telemry visibility' "${todo}")
          if [[ "${count}" != '1' ]]; then
            echo "::error::Expected one stale telemry typo, found ${count}."
            exit 1
          fi
          sed -i 's/FIX-02 stale telemry visibility/FIX-02 stale telemetry visibility/' "${todo}"
          git diff --check

      - name: Commit corrected documentation
        shell: bash
        run: |
          set -euo pipefail
          git add esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_REVIEW_FIXES_TODO_2026-07-30.md
          if git diff --cached --quiet; then
            echo '::error::Typo correction produced no change.'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: correct duplex review closeout wording'
          git push origin HEAD:feature/esp-bt-audio-duplex
