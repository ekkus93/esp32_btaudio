name: One-shot Duplex Review Documentation Closeout

on:
  push:
    branches:
      - feature/esp-bt-audio-duplex
    paths:
      - .github/workflows/one-shot-duplex-review-docs-closeout.yml

permissions:
  contents: write

concurrency:
  group: one-shot-duplex-review-docs-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Append validated review closeout evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Append validated documentation sections
        shell: bash
        run: |
          set -euo pipefail
          closeout='esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_SOFTWARE_CLOSEOUT_AND_CLAUDE_DEVICE_HANDOFF_2026-07-29.md'
          todo='esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_REVIEW_FIXES_TODO_2026-07-30.md'
          if grep -Fq '## Review follow-up closeout — 2026-07-30' "${closeout}"; then
            echo "::error::Review closeout section already exists."
            exit 1
          fi
          if grep -Fq '## Completion reconciliation — 2026-07-30' "${todo}"; then
            echo "::error::TODO completion reconciliation already exists."
            exit 1
          fi
          closeout_b64=''
          todo_b64='  C0xOC9GRC0xOSwgYnJvYWQgQ01ha2UgbW9kdWxhcml6YXRpb24sIGFuZCB0aGUgUHl0aG9uIGNsZWFudXAgYmFja2xvZyByZW1haW4gb3V0c2lkZSB0aGlzIFRPRE8uCg=='
          printf '%s' "${closeout_b64}" | base64 -d >> "${closeout}"
          printf '%s' "${todo_b64}" | tr -d ' ' | base64 -d >> "${todo}"

      - name: Verify and commit documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_SOFTWARE_CLOSEOUT_AND_CLAUDE_DEVICE_HANDOFF_2026-07-29.md \
            esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_REVIEW_FIXES_TODO_2026-07-30.md
          if git diff --cached --quiet; then
            echo '::error::Documentation closeout produced no changes.'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: reconcile duplex review fixes closeout'
          git push origin HEAD:feature/esp-bt-audio-duplex
