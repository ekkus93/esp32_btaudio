name: One-shot Duplex Review Documentation Closeout

on:
  push:
    branches:
      - feature/esp-bt-audio-duplex
    paths:
      - .github/workflows/one-shot-duplex-review-docs-closeout.yml

permissions:
  contents: write

concurrency:
  group: one-shot-duplex-review-docs-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Append validated review closeout evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Append original closeout review section
        shell: bash
        run: |
          set -euo pipefail
          closeout='esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_SOFTWARE_CLOSEOUT_AND_CLAUDE_DEVICE_HANDOFF_2026-07-29.md'
          marker='## Review follow-up closeout — 2026-07-30'
          if grep -Fq "${marker}" "${closeout}"; then
            echo "::error::Review follow-up section already exists in ${closeout}."
            exit 1
          fi
          cat >> "${closeout}" <<'EOF'

---

## Review follow-up closeout — 2026-07-30

The follow-up work specified by:

`esp_bt_audio_source/docs/ESP_BT_AUDIO_DUPLEX_STABILIZATION_REVIEW_FIXES_TODO_2026-07-30.md`

