name: One-shot late STOP test repair

on:
  push:
    branches:
      - feature/esp-bt-audio-duplex
    paths:
      - tools/one_shot_patch_late_stop_test.py
      - .github/workflows/one-shot-late-stop-test-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-late-stop-test-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/esp-bt-audio-duplex
          fetch-depth: 0

      - name: Apply exact test transformation
        run: python3 tools/one_shot_patch_late_stop_test.py

      - name: Verify exact contract before commit
        run: |
          set -euo pipefail
          grep -q 'late_terminal_events_ignored + 1U' \
            esp_bt_audio_source/test/host_test/test_bluetooth_cases.c
          grep -q 'audio_callback_before' \
            esp_bt_audio_source/test/host_test/test_bluetooth_cases.c
          ! grep -q 'TEST_ASSERT_EQUAL(ESP_A2D_AUDIO_STATE_STOPPED, bt_manager_test_get_last_audio_state())' \
            esp_bt_audio_source/test/host_test/test_bluetooth_cases.c

      - name: Remove one-shot machinery and commit real edit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/one_shot_patch_late_stop_test.py
          git rm .github/workflows/one-shot-late-stop-test-repair.yml
          git add esp_bt_audio_source/test/host_test/test_bluetooth_cases.c
          git diff --cached --check
          git commit -m "test(a2dp): align legacy late STOP assertion with FIX1"
          git push origin HEAD:feature/esp-bt-audio-duplex
